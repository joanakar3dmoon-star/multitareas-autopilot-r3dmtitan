name: Phase 3 bot and connector tests
on:
  push:
    branches: ["phase3/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
