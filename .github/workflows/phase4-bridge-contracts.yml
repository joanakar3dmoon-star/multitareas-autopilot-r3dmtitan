name: Phase 4 bridge contracts
on:
  push:
    branches: ["phase4/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  bridge-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile integration adapters
        run: python -m compileall -q integrations
      - name: Run bridge contract tests
        run: python -m unittest tests.test_phase4_bridges -v
