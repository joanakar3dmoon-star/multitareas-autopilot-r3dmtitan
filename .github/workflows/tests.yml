name: Multitareas tests
on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q core pulpos tests run_worker.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
